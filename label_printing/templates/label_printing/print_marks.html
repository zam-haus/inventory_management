{% load i18n icons %}{# Printer and labels of a label in the print dialog: green when there, struck through in red when they keep it from being printed now (item: an outcome of dialog.options; print_label.js sets them for the overview's rows). #}<span class="label-marks" data-marks>
    <span class="label-mark {% if item.missing == 'printer' %}is-missing{% else %}is-ok{% endif %}" data-mark="printer" title="{% if item.missing == 'printer' %}{{ item.reason }}{% elif item.printer %}{{ item.printer }}{% else %}{% trans 'Printer' %}{% endif %}">{% icon "printer" %}</span>
    <span class="label-mark {% if item.missing == 'material' %}is-missing{% else %}is-ok{% endif %}" data-mark="material" title="{% if item.missing == 'material' %}{{ item.reason }}{% else %}{{ item.size }}{% endif %}">{% icon "tag" %}</span>
</span>
