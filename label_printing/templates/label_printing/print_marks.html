{% load icons %}{# Whether a label in the print dialog can be printed now: the printer mark, green, or struck through in red; its title says where it prints, else why not (item: an outcome of dialog.options; print_label.js sets it for the overview's rows). #}<span class="label-mark {% if item.printer %}is-ok{% else %}is-missing{% endif %}" title="{{ item.status }}" data-mark>{% icon "printer" %}</span>
