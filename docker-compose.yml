services:
  db:
    image: postgres:18
    volumes:
      - ./data/db:/var/lib/postgresql
    env_file:
      - ".env"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  web:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/media_files
      - ./data/static:/static_files
    ports:
      - "80:80"
    depends_on:
      - python
    restart: unless-stopped
    networks:
      - default

  python:
    build: .
    volumes:
      - .:/code
    env_file:
      - ".env"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
networks:
  default: