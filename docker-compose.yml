# Production setup (podman-compose or docker compose). Update, backup, restore: ops/README.md
services:
  db:
    image: docker.io/library/postgres:18
    volumes:
      - ./data/db:/var/lib/postgresql
    env_file:
      - ".env"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  web:
    image: docker.io/library/nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/media_files
      - ./data/static:/static_files
    ports:
      - "80:80"
    depends_on:
      - python
    # The whole chain: nginx and the app (/healthz, imzam/health.py)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - default

  python:
    build: .
    # The code is in the image; only data comes from the host.
    volumes:
      - ./data/media:/code/data/media
      - ./data/static:/code/data/static
      - ./exports:/code/exports
    env_file:
      - ".env"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s  # collectstatic and migrations on start
    restart: unless-stopped
    networks:
      - default
  # Broker for Celery: hands print jobs for network printers to the worker.
  redis:
    image: docker.io/library/redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  # Prints on network printers (docs/label-printing.md), one job at a time; needs to reach them on port 9100.
  worker:
    build: .
    command: celery -A imzam worker --queues label_printing --concurrency 1 --loglevel INFO
    env_file:
      - ".env"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A imzam inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - default

networks:
  default:
