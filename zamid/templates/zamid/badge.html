{% load i18n static %}
{% if zid %}
    <div class="zam-badge">
        <img src="{% url 'zamid_qr_svg' zid.code %}" width="56" height="56" alt="">
        <div>
            <span class="zam-badge-eyebrow">{% trans "ZAM ID" %}</span>
            {% if can_view %}<a class="zam-badge-code" href="{% url 'zamid_info' zid.code %}">{{ zid.display }}</a>{% else %}<span class="zam-badge-code">{{ zid.display }}</span>{% endif %}
        </div>
    </div>
{% elif can_claim %}
    <form class="zam-badge zam-badge-claim" method="post" action="{{ claim_url }}" data-zamid-claim>
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <label class="zam-badge-eyebrow" for="zamid-claim-{{ claim_url|slugify }}">{% trans "Attach ZAM ID label" %}</label>
        <div class="input-group input-group-sm">
            <input class="form-control" id="zamid-claim-{{ claim_url|slugify }}" name="code" required placeholder="K7Q-4XD" autocomplete="off" spellcheck="false">
            <button type="button" class="btn btn-outline-secondary" data-zamid-scan hidden
                    data-title="{% trans 'Scan ZAM ID label' %}" data-hint="{% trans 'Hold the new label in front of the camera.' %}"
                    data-added="{% trans 'Scanned {code}' %}" data-duplicate="{% trans 'Already scanned {code}' %}"
                    aria-label="{% trans 'Scan label' %}" title="{% trans 'Scan label' %}"><span aria-hidden="true">📷</span></button>
            <button type="submit" class="btn btn-outline-primary">{% trans "Attach" %}</button>
        </div>
    </form>
    {% include 'inventory/barcode_scanner_script.html' %}
    <link rel="stylesheet" href="{% static 'inventory/barcode_scanner.css' %}">
    <script src="{% static 'zamid/zam_badge.js' %}"></script>
{% endif %}
{% if zid or can_claim %}<link rel="stylesheet" href="{% static 'zamid/zam_badge.css' %}">{% endif %}
