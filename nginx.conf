server {
  # Default server: inventar.zam.haus is the main address; every other domain lands here
  # too and is redirected by Django (imzam/canonical_host.py).
  listen 80 default_server;
  server_name localhost inventar.zam.haus inv.zam.haus;
  client_max_body_size 64M;
  location / {
    proxy_pass              http://python:8000;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        Host $host;
    proxy_redirect          off;
    # As long as gunicorn lets a request run (GUNICORN_TIMEOUT, web-entrypoint.sh)
    proxy_read_timeout      120s;
  }
  # Healthchecks of the containers and the load balancer (ops/README.md), not logged
  location = /healthz {
    proxy_pass              http://python:8000;
    access_log              off;
  }
  # Attached documents are only served by the app, which checks internal ones.
  location /media/documents/ {
    deny all;
  }
  location /media {
    alias /media_files;
  }
  location /static {
    alias /static_files;
  }
}

# Permanent ZAM ID resolver (QR codes on labels): same Django app, own URLconf.
server {
  listen 80;
  server_name i.zam.haus id.zam.haus;
  location / {
    proxy_pass              http://python:8000;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Host $host;
    proxy_redirect          off;
  }
}
