server {
  listen 80;
  server_name localhost inv.zam.haus;
  client_max_body_size 64M;
  location / {
    proxy_pass              http://python:8000;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        Host $host;
    proxy_redirect          off;
  }
  # Attached documents are only served by the app, which checks internal ones.
  location /media/documents/ {
    deny all;
  }
  location /media {
    alias /media_files;
  }
  location /static {
    alias /static_files;
  }
}

# Permanent ZAM ID resolver (QR codes on labels): same Django app, own URLconf.
server {
  listen 80;
  server_name i.zam.haus id.zam.haus;
  location / {
    proxy_pass              http://python:8000;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Host $host;
    proxy_redirect          off;
  }
}
