{% extends 'base.html' %}

{% load i18n static icons %}

{% block title %}{% trans "ZAM inventory" %}{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 36rem">
    <form method="get" action="{% url 'index_items' %}" role="search">
        <div class="input-group input-group-lg mb-3">
            <span class="input-group-text" aria-hidden="true">{% icon "search" %}</span>
            <input type="search" class="form-control" name="q" aria-label="{% trans 'Search' %}"
                   placeholder="{% blocktrans with name=label_id_name %}Name, identifier or {{ name }}{% endblocktrans %}" enterkeyhint="search">
        </div>
        <div class="d-grid gap-2 d-sm-flex">
            <button type="submit" class="btn btn-info flex-sm-fill">{% trans "Search items" %}</button>
            <button type="submit" class="btn btn-info flex-sm-fill" formaction="{% url 'index_locations' %}">{% trans "Search locations" %}</button>
            {% include 'inventory/scan_link_button.html' with classes="btn btn-info flex-sm-fill" wrapper_classes="flex-sm-fill" %}
        </div>
    </form>
</div>
{% endblock %}
