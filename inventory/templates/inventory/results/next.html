{% load i18n %}
{# After a list: results.js loads the next rows when this comes into view; without JavaScript it is a link. #}
{% if next_url %}
    <p class="result-next" data-result-next="{{ next_url }}"><a href="{{ next_url }}">{% trans "More results" %}</a></p>
{% elif capped %}
    <p class="result-more">{% trans "There are more results than shown. Add words to narrow the search." %}</p>
{% endif %}
