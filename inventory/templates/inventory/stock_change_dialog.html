{% load i18n icons %}
<div class="modal fade stock-change-modal" id="stock-change" tabindex="-1" aria-labelledby="stock-change-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <form method="post" action="" class="stock-change-form" {% include 'inventory/stock_change_form_attrs.html' %}>
                {% csrf_token %}
                <div class="modal-header">
                    <div class="stock-change-heading">
                        <h2 class="modal-title fs-5" id="stock-change-title">{% icon "cart" %} {% trans "Change stock" %}</h2>
                        <p class="stock-change-subject"><strong data-change-item></strong><span data-change-location-fixed> · <span data-change-location-title></span> <span class="loc-code" data-change-location></span></span></p>
                        {# For an item with several locations ("Take out" on its page): where. #}
                        <select class="form-select form-select-sm stock-change-location-choice" data-change-location-choice aria-label="{% trans 'Location' %}" hidden></select>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Cancel' %}"></button>
                </div>
                <div class="modal-body">
                    {% include 'inventory/stock_change_fields.html' with form=stock_change_form entry=None next='' is_last_stock=False %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "Cancel" %}</button>
                    <button type="submit" class="btn btn-warning" data-change-submit>{% trans "Save" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
