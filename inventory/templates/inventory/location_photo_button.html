{% load i18n actions %}{# 📷 for the overview photo: beside the photo, or beside "At this location …" while there is none. #}
{% if perms.inventory.change_location %}

{% else %}
    {% disabled_action "📷" name=_("Edit overview photo") classes="btn btn-primary location-edit-overview" %}
{% endif %}
