{% load i18n %}{# How shelves and their compartments are numbered; shown while one is created. With parts_only just the compartments of shelf `code`. #}
{% with prefix=kind.auto_short_name_prefix sub=kind.sublocation_type %}{% firstof code prefix|add:"301" as shelf %}
<figure class="numbering-order{% if parts_only %} numbering-order-parts{% endif %}">
    <svg viewBox="{% if parts_only %}400 0 170 240{% else %}0 0 580 240{% endif %}" role="img" aria-labelledby="numbering-order-caption" style="max-width:100%;height:auto">
        <defs>
            <marker id="numbering-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
            </marker>
        </defs>
        {% if not parts_only %}
        <g fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="10" y1="190" x2="375" y2="190"/>
            <rect x="20" y="60" width="72" height="130"/>
            <rect x="110" y="60" width="72" height="130"/>
            <rect x="200" y="60" width="72" height="130"/>
            <rect x="290" y="60" width="72" height="130" stroke-dasharray="5 4"/>
            <line x1="20" y1="215" x2="362" y2="215" marker-end="url(#numbering-arrow)"/>
        </g>
        <g fill="currentColor" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">
            <text x="56" y="50">{{ prefix }}301</text>
            <text x="146" y="50">{{ prefix }}302</text>
            <text x="236" y="50">{{ prefix }}303</text>
            <text x="326" y="50">{{ prefix }}304</text>
        </g>
        <g fill="currentColor" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">
            <text x="326" y="130">{% trans "new" %}</text>
            <text x="191" y="234">{% trans "left lower, right higher" %}</text>
            <text x="191" y="18" font-weight="600">{% trans "Side by side" %}</text>
        </g>
        {% endif %}
        {% if sub %}
        <g fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="420" y="85" width="100" height="105"/>
            <line x1="420" y1="120" x2="520" y2="120"/>
            <line x1="420" y1="155" x2="520" y2="155"/>
            <line x1="410" y1="190" x2="530" y2="190"/>
            <rect x="428" y="35" width="84" height="46" stroke-dasharray="5 4"/>
            <line x1="545" y1="185" x2="545" y2="40" marker-end="url(#numbering-arrow)"/>
        </g>
        <g fill="currentColor" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">
            <text x="470" y="177">{{ shelf }}.a</text>
            <text x="470" y="142">{{ shelf }}.b</text>
            <text x="470" y="107">{{ shelf }}.c</text>
            <text x="470" y="56">{{ shelf }}.d</text>
        </g>
        <g fill="currentColor" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">
            <text x="470" y="18" font-weight="600">{{ sub.name }}</text>
            <text x="470" y="73" font-size="11">{% trans "on top" %}</text>
            <text x="470" y="234">{% trans "from the bottom up" %}</text>
        </g>
        {% endif %}
    </svg>
    <figcaption id="numbering-order-caption" class="{% if parts_only %}visually-hidden{% else %}location-muted{% endif %}">
        {% if not parts_only %}{% trans "Neighbours get consecutive numbers, the lower one on the left; a new one is added at the end of the row." %}{% endif %}
        {% if sub %}{% blocktrans with sub=sub.name %}{{ sub }}: lettered from the bottom up, starting with a. The top counts as one too if things are put on it: it gets the last letter.{% endblocktrans %}{% endif %}
    </figcaption>
</figure>
{% endwith %}
